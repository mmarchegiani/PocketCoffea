# Object preselection for Delphes objects (fields of the coffea DelphesSchema)
object_preselection:
  Muon:
    pt: 15.0
    eta: 2.4
    iso: 0.25   # Delphes IsolationVar (relative isolation)
  Electron:
    pt: 15.0
    eta: 2.5
    iso: 0.25   # Delphes IsolationVar (relative isolation)
  Jet:
    pt: 25.0
    eta: 2.5
    dr_lepton: 0.4
    btag_bit: 0   # bit of Jet.BTag to use (bit 0 = default working point of the Delphes card)
